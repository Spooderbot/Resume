<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #24292f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        iframe {
            width: 90%;
            height: 85vh;
            display: block;
            margin: 20px auto;
            border: none;
        }

        .download {
            text-align: center;
            padding: 15px;
        }

        a {
            color: #0969da;
        }
    </style>
</head>

<body>

    <header>
        <h1>My PDF Portfolio</h1>
        <p>Welcome to my online document!</p>
    </header>

    <iframe src="resume.pdf"></iframe>

    <div class="download">
        <a href="resume.pdf" download>
            Download PDF
        </a>
    </div>

</body>
</html>
